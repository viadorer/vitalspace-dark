<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://vitalspace.cz/">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <title>VitalSpace — Certifikovaná ozonová sanitace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',system-ui,sans-serif;
            background:#0a0e17;
            color:#f0f4f8;
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            overflow:hidden;
        }
        .loader {
            text-align:center;
            animation:loaderIn 0.6s ease-out both;
        }
        @keyframes loaderIn {
            from { opacity:0; transform:translateY(16px) scale(0.96); }
            to   { opacity:1; transform:translateY(0) scale(1); }
        }
        .loader-logo {
            display:flex; align-items:center; justify-content:center; gap:0.5rem;
            font-size:1.75rem; font-weight:800; margin-bottom:1.5rem;
        }
        .loader-logo svg {
            width:32px; height:32px; color:#59a8ff;
        }
        .loader-bar-track {
            width:200px; height:3px; border-radius:4px;
            background:rgba(51,136,255,0.12);
            margin:0 auto; overflow:hidden;
        }
        .loader-bar {
            height:100%; border-radius:4px;
            background:linear-gradient(90deg,#3388ff,#59a8ff);
            animation:barFill 1s cubic-bezier(0.4,0,0.2,1) forwards;
        }
        @keyframes barFill {
            from { width:0; }
            to   { width:100%; }
        }
        .loader-text {
            margin-top:1rem; font-size:0.8125rem;
            color:rgba(136,153,170,0.7);
            animation:textPulse 1.2s ease-in-out infinite;
        }
        @keyframes textPulse {
            0%,100% { opacity:0.5; }
            50%     { opacity:1; }
        }
        .loader-orb {
            position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none;
            background:rgba(51,136,255,0.15);
        }
    </style>
<!-- AIO:SCHEMA:START -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",

  "name": "VitalSpace",
  "description": "Ozonová sanitace pro longevity a wellness. Profesionální dezinfekce a sanitace prostor ozonem.",
  "keywords": "ozonová sanitace, dezinfekce ozonem, wellness, longevity, kvalita vzduchu, profesionální sanitace"
}
</script>
<script type="application/ld+json">

  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Co je VitalSpace?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "VitalSpace je certifikovaná služba ozonové sanitace."
      }
    },
    {
      "@type": "Question",
      "name": "Na co se specializuje VitalSpace?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "VitalSpace se specializuje na ozonovou sanitaci."
      }
    },
    {
      "@type": "Question",
      "name": "Jaká je domovská stránka VitalSpace?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Domovská stránka VitalSpace je vitalspace-homepage.html."
      }
    }
  ]
}
</script>
<!-- AIO:SCHEMA:END -->
</head>
<body>
    <div class="loader-orb" style="width:400px;height:400px;top:-20%;left:-10%;"></div>
    <div class="loader-orb" style="width:300px;height:300px;bottom:-15%;right:-5%;background:rgba(99,102,241,0.08);"></div>

    <div class="loader">
        <div class="loader-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
            VitalSpace
        </div>
        <div class="loader-bar-track">
            <div class="loader-bar"></div>
        </div>
        <p class="loader-text">Načítání systému…</p>
    </div>

    <script>
        // Redirect after loading animation completes
        setTimeout(function () {
            window.location.replace('vitalspace-homepage.html');
        }, 1100);
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; url=vitalspace-homepage.html">
    </noscript>
</body>
</html>
